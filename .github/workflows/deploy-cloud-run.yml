name: Build & Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
      - 'nginx.conf.template'
      - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:

env:
  SERVICE_NAME: doinsport-sessions
  REGION: europe-west1
  IMAGE_REGISTRY: europe-west1-docker.pkg.dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ☁️ Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 🐳 Configure Docker authentication
        run: |
          gcloud auth configure-docker ${{ env.IMAGE_REGISTRY }}

      - name: 🏗️ Build Docker image
        run: |
          docker build \
            --tag "${{ env.IMAGE_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/docker-repo/${{ env.SERVICE_NAME }}:${{ github.sha }}" \
            --tag "${{ env.IMAGE_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/docker-repo/${{ env.SERVICE_NAME }}:latest" \
            .

      - name: 📤 Push to Artifact Registry
        run: |
          docker push "${{ env.IMAGE_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/docker-repo/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker push "${{ env.IMAGE_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/docker-repo/${{ env.SERVICE_NAME }}:latest"

      - name: 🚀 Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.IMAGE_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/docker-repo/${{ env.SERVICE_NAME }}:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --platform managed \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: ✅ Output Cloud Run URL
        run: |
          echo "🎉 App déployée sur Cloud Run!"
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format='value(status.url)'
